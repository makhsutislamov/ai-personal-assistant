<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant Capture</title>
    <style>
      body { font-family: system-ui; padding: 12px; min-width: 280px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      #status { font-size: 12px; color: #555; margin-bottom: 8px; }
      #status.success { color: #2d7d2d; }
      #status.error { color: #c00; }
      label { font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>AI Assistant Capture</h1>
    <div id="status">Right-click any page or selection to capture.</div>
    <div>
      <label>
        <input type="checkbox" id="fullPageToggle" />
        Include full page content
      </label>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
