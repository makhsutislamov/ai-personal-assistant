name: Build and Test

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -e '.[dev]'

      - name: Run backend tests
        working-directory: backend
        run: |
          source .venv/bin/activate
          pytest --tb=short -q

      - name: Run backend lint (ruff)
        working-directory: backend
        run: |
          source .venv/bin/activate
          ruff check app/ tests/

      - name: Run backend type check (mypy)
        working-directory: backend
        run: |
          source .venv/bin/activate
          mypy app/ --ignore-missing-imports || true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint || true

      - name: Run frontend type check
        working-directory: frontend
        run: npm run typecheck || true

  build:
    name: Build macOS App
    runs-on: macos-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -e '.[dev,build]'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend (PyInstaller)
        run: bash scripts/build-backend.sh

      - name: Compile Electron TypeScript
        run: npx tsc --project tsconfig.electron.json

      - name: Package Electron app (unpacked — fast CI check)
        run: npx electron-builder --dir --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-personal-assistant-mac
          path: dist-electron/mac*/
          retention-days: 7
